<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uye Ekle - Kutuphane</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        header {
            background: rgba(255,255,255,0.05);
            padding: 20px 0;
            margin-bottom: 40px;
            text-align: center;
        }
        header h1 { color: #e94560; }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 25px;
        }
        
        .form-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1em;
        }
        .form-group input:focus { outline: none; border-color: #e94560; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>[+] Yeni Uye Ekle</h1>
        <nav>
            <a href="/">Ana Sayfa</a>
            <a href="/uyeler">Uyeler</a>
        </nav>
    </header>
    
    <main class="container">
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label>Ad Soyad *</label>
                    <input type="text" name="name" required minlength="2" maxlength="100" 
                           placeholder="Orn: Ahmet Yilmaz" title="Ad soyad en az 2 karakter olmali">
                </div>
                <div class="form-group">
                    <label>Telefon *</label>
                    <input type="tel" name="phone" required minlength="7" maxlength="20" 
                           placeholder="Orn: 0532 123 4567" title="Gecerli telefon numarasi girin"
                           pattern="[0-9\s\-\+]{7,20}">
                </div>
                <div class="form-group">
                    <label>E-posta *</label>
                    <input type="email" name="email" required maxlength="100" 
                           placeholder="Orn: ahmet@email.com" title="Gecerli e-posta adresi girin">
                </div>
                <div class="form-group">
                    <label>Adres *</label>
                    <input type="text" name="address" required minlength="5" maxlength="200" 
                           placeholder="Orn: Istanbul, Turkiye" title="Adres en az 5 karakter olmali">
                </div>
                <button type="submit" class="btn">Uye Ekle</button>
            </form>
            <center><a href="/uyeler" class="btn-back">< Geri Don</a></center>
        </div>
    </main>
</body>
</html>
